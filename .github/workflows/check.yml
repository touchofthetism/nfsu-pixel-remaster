# Runs on every push, in minutes: compiles the launcher (Java) and its unit tests, the host C++ with the
# NDK in syntax-only mode, and the host unit tests. No game data is involved.
# The APK itself is built by the private companion repository (it holds the game inputs and publishes
# the signed builds); that workflow checks this repository out at the commit named in its BUILD file.
name: check
on:
  push:
    branches: [main]
    paths-ignore: [docs/**, "**.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: nfsu1-recompiled } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: nfsu1-recompiled }
      - name: Pins
        id: pins
        run: |
          set -a; source ci/pins.env; set +a
          for v in ANDROID_PLATFORM ANDROID_BUILD_TOOLS ANDROID_NDK ANDROID_CMAKE JAVA_VERSION; do echo "$v=${!v}" >> "$GITHUB_OUTPUT"; done
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "${{ steps.pins.outputs.JAVA_VERSION }}" }
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q glslang-tools spirv-tools ninja-build
          python3 -m pip install --quiet capstone pefile
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;${{ steps.pins.outputs.ANDROID_PLATFORM }}" \
            "build-tools;${{ steps.pins.outputs.ANDROID_BUILD_TOOLS }}" "ndk;${{ steps.pins.outputs.ANDROID_NDK }}" \
            "cmake;${{ steps.pins.outputs.ANDROID_CMAKE }}" >/dev/null
          # The install's output is noise, its result is not: every pinned package must be on disk.
          for dir in "platforms/${{ steps.pins.outputs.ANDROID_PLATFORM }}" "build-tools/${{ steps.pins.outputs.ANDROID_BUILD_TOOLS }}" \
                     "ndk/${{ steps.pins.outputs.ANDROID_NDK }}" "cmake/${{ steps.pins.outputs.ANDROID_CMAKE }}"; do
            test -d "$ANDROID_HOME/$dir" || { echo "::error::sdkmanager did not install $dir"; exit 1; }
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ steps.pins.outputs.ANDROID_NDK }}" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Sibling checkouts + DXVK
        run: bash ci/setup_siblings.sh
      - name: Host C++ syntax
        run: bash ci/syntax_check.sh
      - name: Host unit tests
        run: bash ci/host_tests.sh
      - name: Texture toolkit tests (tools/nfstex)
        run: |
          python3 -m pip install --quiet --user numpy
          python3 -m unittest discover -s tools -p "test_*.py" -v
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('nfsu1-recompiled/android/**/*.gradle', 'nfsu1-recompiled/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Launcher compiles + unit tests
        working-directory: nfsu1-recompiled/android
        run: bash ./gradlew --no-daemon --console=plain :app:compileReleaseJavaWithJavac :app:testReleaseUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-test-reports
          path: nfsu1-recompiled/android/app/build/reports
          if-no-files-found: ignore
